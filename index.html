<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switchboard - Logic Simulator</title>
<style>
:root{
  --canvas:#2b2b2b; --panel:#3c3f41; --panel2:#45494a; --hdr:#4b4f51; --line:#262626; --line2:#555a5c;
  --text:#bbbbbb; --hi:#e8e8e8; --dim:#8a8a8a; --in:#1e1e1e; --sel:#0078d7; --on:#00e676; --bad:#ff3b30; --warn:#ffb300;
  --ui:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif; --mono:Consolas,Monaco,"Courier New",monospace;
}
*{box-sizing:border-box;border-radius:0 !important;box-shadow:none !important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--panel);color:var(--text);font:12px/1.35 var(--ui);user-select:none;-webkit-user-select:none}
input,select,textarea{font:12px var(--ui);color:var(--hi);background:var(--in);border:1px solid var(--line2);padding:1px 4px;height:20px;outline:none;user-select:text;-webkit-user-select:text}
textarea{height:auto;font:11px/1.4 var(--mono);resize:vertical;width:100%;padding:3px 4px}
input:focus,select:focus,textarea:focus{border-color:var(--sel)}
input[type=checkbox]{height:auto;accent-color:var(--sel);margin:0 3px 0 0;vertical-align:-2px}
input[type=color]{padding:0 1px;width:36px;height:18px;background:var(--in)}
input[type=number]::-webkit-inner-spin-button{opacity:.5}
.btn{font:12px var(--ui);color:#dddddd;background:#4c5052;border:1px solid #5e6366;padding:1px 10px;height:22px;cursor:default;white-space:nowrap}
.btn:hover{background:#565a5c;border-color:#6b7072}
.btn:active{background:#3a3d3f}
.btn.pri{background:#1f5f9a;border-color:var(--sel);color:#fff}
.btn.pri:hover{background:#2770b3}
.btn.danger{color:#ff8a80}
.btn:disabled{opacity:.45}
#app{display:flex;flex-direction:column;height:100%}
#menubar{height:22px;flex:none}#toolbar{height:30px;flex:none}#editbar{flex:none}#status{height:22px;flex:none}

/* ---- menu bar ---- */
#menubar{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);padding-left:2px}
#menubar .mi{padding:0 8px;display:flex;align-items:center;color:#d0d0d0;cursor:default}
#menubar .mi:hover,#menubar .mi.open{background:var(--sel);color:#fff}
#menubar .title{margin-left:auto;padding:0 10px;color:var(--dim);display:flex;align-items:center;gap:6px}
#menubar .title b{color:#cfcfcf;font-weight:600}
.dd{position:fixed;background:var(--panel);border:1px solid #6a6a6a;padding:2px 0;min-width:240px;z-index:100;display:none}
.dd.show{display:block}
.dd .it{display:grid;grid-template-columns:18px 1fr auto;align-items:center;padding:3px 14px 3px 4px;color:#d6d6d6;cursor:default;white-space:nowrap}
.dd .it .k{color:var(--dim);padding-left:24px;font-size:11px}
.dd .it:hover{background:var(--sel);color:#fff}.dd .it:hover .k{color:#dce9f7}
.dd .it.dis{color:#6f6f6f}.dd .it.dis:hover{background:none;color:#6f6f6f}
.dd .lbl{padding:4px 8px 2px 22px;color:var(--dim);font-size:11px}
.dd .sep{border-top:1px solid #555;margin:3px 2px}

/* ---- toolbar ---- */
#toolbar{display:flex;align-items:center;gap:1px;padding:0 4px;background:var(--panel);border-bottom:1px solid var(--line)}
.tb{width:24px;height:22px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:#cfcfcf;cursor:default;padding:0;font:13px var(--ui)}
.tb svg{width:16px;height:16px}
.tb:hover{background:#4c5052;border-color:#5e6366}
.tb.on{background:#2d4f73;border-color:var(--sel);color:#fff}
.tb:disabled{opacity:.35;background:none;border-color:transparent}
.tsep{width:1px;height:18px;background:#2a2a2a;border-right:1px solid #4e5254;margin:0 5px}
.tlab{color:var(--dim);margin:0 4px 0 2px}
#toolbar input[type=number],#toolbar input[type=text]{width:62px;font:11px var(--mono);text-align:right}
#toolbar label{display:flex;align-items:center;color:#cfcfcf;margin:0 4px}

/* ---- chip edit bar ---- */
#editbar{display:none;align-items:center;gap:6px;padding:3px 8px;background:#4a4430;border-bottom:1px solid var(--line);color:#f1e3b5}
#editbar.show{display:flex}
#editbar b{color:#fff3cc}
#editbar .sp{flex:1}

/* ---- main split layout ---- */
#main{flex:1;display:flex;min-height:0;border-bottom:1px solid var(--line)}
.panel{display:flex;flex-direction:column;background:var(--panel);min-width:0;min-height:0}
.phead{height:21px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--panel2);border-bottom:1px solid var(--line);color:#d0d0d0;font-size:11px}
.phead .sp{flex:1}
.phead .x{color:var(--dim);cursor:default;padding:0 3px}.phead .x:hover{color:#fff;background:#5a5e60}
.pbody{flex:1;overflow:auto;min-height:0}
#palette{width:var(--palW,220px)}
#inspector{width:var(--insW,280px)}
.split{flex:none;background:var(--panel);position:relative;z-index:2}
.split.v{width:4px;cursor:col-resize;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.split.h{height:4px;cursor:row-resize;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.split:hover,.split.drag{background:var(--sel)}
.hidden{display:none !important}
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--canvas)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#tip{position:absolute;pointer-events:none;background:#1e1e1e;border:1px solid #6a6a6a;padding:2px 6px;font:11px/1.4 var(--mono);color:#e0e0e0;display:none;white-space:pre;z-index:5}

/* ---- component tree ---- */
#treeSearch{display:block;width:calc(100% - 8px);margin:4px}
.tree{padding-bottom:12px}
.tr{display:flex;align-items:center;height:19px;padding-right:6px;cursor:default;white-space:nowrap;color:#cccccc}
.tr:hover{background:#4b4f51}
.tr.armed{background:var(--sel);color:#fff}
.tr.armed .meta{color:#dce9f7}
.tr .tw{width:14px;flex:none;text-align:center;color:#9a9a9a;font-size:9px}
.tr .ic{width:16px;height:14px;flex:none;margin-right:5px;color:#a9b7c6;display:grid;place-items:center}
.tr .ic svg{width:14px;height:14px}
.tr .nm{overflow:hidden;text-overflow:ellipsis}
.tr .meta{margin-left:auto;padding-left:8px;color:#7a7a7a;font:11px var(--mono)}
.tr.grp{color:#dddddd;font-weight:600}
.tr.grp .nm{font-weight:600}
.tr.empty{color:#7d7d7d;white-space:normal;height:auto;padding:3px 8px 6px 34px;line-height:1.4}
.tr.dis{opacity:.4}
.chipsw{width:10px;height:10px;display:inline-block;border:1px solid #1e1e1e}

/* ---- property grid ---- */
.objsel{display:flex;align-items:center;gap:6px;height:22px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--in);color:#e0e0e0;font-weight:600}
.objsel span{color:var(--dim);font:11px var(--mono);font-weight:400}
table.pg{width:100%;border-collapse:collapse;table-layout:fixed}
table.pg th,table.pg td{border:1px solid #303233;height:20px;padding:0 5px;font-weight:400;text-align:left;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.pg th{width:42%;color:#bdbdbd;background:var(--panel)}
table.pg td{background:#313335;color:#e2e2e2}
table.pg td.ro{color:#a8a8a8}
table.pg td.mono,table.pg .mono{font:11px var(--mono)}
table.pg td input:not([type=checkbox]):not([type=color]),table.pg td select{width:100%;height:19px;border:1px solid transparent;background:transparent;padding:0 2px;margin:0}
table.pg td input:hover,table.pg td select:hover{border-color:#4e5254}
table.pg td input:focus,table.pg td select:focus{background:var(--in);border-color:var(--sel)}
table.pg td select option{background:#2b2b2b}
table.pg tr.cat td{background:var(--hdr);color:#e6e6e6;font-weight:600;font-size:11px;padding-left:4px;cursor:default}
table.pg tr.cat td:before{content:"▾ ";color:#a0a0a0;font-size:9px}
table.pg tr.cat.col td:before{content:"▸ "}
table.pg td.full{padding:3px 4px;white-space:normal}
table.pg td.full textarea{border-color:#4e5254}
table.pg .tr8{float:right;color:var(--sel);cursor:default;padding:0 2px;font-family:var(--ui)}
table.pg .tr8:hover{color:#fff;background:var(--sel)}
.pgbtns{display:flex;flex-wrap:wrap;gap:3px;padding:5px 4px;border-bottom:1px solid #303233}
.desc{padding:6px 8px;color:#9a9a9a;line-height:1.45;border-top:1px solid #303233;white-space:normal}
.desc code,.dlg code{font:11px var(--mono);color:#d0d0d0}
.err{color:#ff8a80;font:11px var(--mono);padding:2px 4px}

/* ---- analyzer ---- */
#analyzer{height:var(--anH,160px);flex:none}
#analyzer .phead .btn{height:17px;padding:0 6px;font-size:11px}
#anBody{position:relative;flex:1;min-height:0;overflow-y:auto;background:#1e1e1e}
#an{display:block;width:100%}
#anEmpty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6f6f6f;pointer-events:none;padding:8px;text-align:center}

/* ---- status bar ---- */
#status{display:flex;align-items:stretch;background:var(--panel);color:#bdbdbd;font:11px var(--ui)}
#status > div{display:flex;align-items:center;padding:0 8px;border-left:1px solid #2a2a2a;box-shadow:inset 1px 0 #4e5254 !important;white-space:nowrap}
#status #sbMsg{flex:1;border-left:none;box-shadow:none !important;overflow:hidden;text-overflow:ellipsis;color:#a8a8a8}
#status #sbMsg.err{background:#5c2522;color:#ffd6d2}
#status #sbMsg.ok{color:#e6e6e6}
#status .v{font-family:var(--mono);color:#e2e2e2;margin-left:4px}
#status .good{color:var(--on)}#status .bad{color:#ff6b60}#status .warn{color:var(--warn)}

/* ---- dialog ---- */
#dlgWrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:200}
#dlgWrap.show{display:flex}
.dlg{background:var(--panel);border:1px solid #707070;min-width:360px;max-width:640px;max-height:86vh;display:flex;flex-direction:column}
.dlg .tt{height:24px;display:flex;align-items:center;padding:0 8px;background:#2d5c8a;color:#fff;font-weight:600}
.dlg .bd{padding:10px 12px;overflow:auto;line-height:1.5;color:#cfcfcf}
.dlg .ft{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;border-top:1px solid #303233}
.dlg .ft .btn{min-width:76px}
.dlg table{border-collapse:collapse;width:100%}
.dlg td{border-bottom:1px solid #353739;padding:2px 6px;vertical-align:top}
.dlg td:first-child{font:11px var(--mono);color:#e6e6e6;white-space:nowrap;width:1%}
.dlg h5{margin:10px 0 4px;font-size:12px;color:#e6e6e6}
</style>
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="editbar"><span>Editing chip:</span><b id="ebName"></b><span class="sp"></span>
    <button class="btn pri" id="ebSave">Save chip</button><button class="btn" id="ebDone">Save &amp; close</button><button class="btn" id="ebDiscard">Discard changes</button></div>
  <div id="main">
    <div class="panel" id="palette"><div class="phead"><span>Components</span><span class="sp"></span><span class="x" data-hide="pal" title="Hide (View menu restores)">✕</span></div><div class="pbody" id="palBody"></div></div>
    <div class="split v" id="spPal"></div>
    <div id="center">
      <div id="wrap"><canvas id="cv" tabindex="0"></canvas><div id="tip"></div></div>
      <div class="split h" id="spAn"></div>
      <div class="panel" id="analyzer">
        <div class="phead"><span>Logic Analyzer</span><span id="anInfo" style="color:var(--dim)"></span><span class="sp"></span>
          <button class="btn" id="anAdd" title="Trace selected wire/part (T)">Trace selection</button><button class="btn" id="anClear">Clear</button><button class="btn" id="anRm">Remove all</button><span class="x" data-hide="an" title="Hide">✕</span></div>
        <div id="anBody"><canvas id="an"></canvas><div id="anEmpty">No signals. Select a wire or part and press T to trace it.</div></div>
      </div>
    </div>
    <div class="split v" id="spIns"></div>
    <div class="panel" id="inspector"><div class="phead"><span>Properties</span><span class="sp"></span><span class="x" data-hide="ins" title="Hide">✕</span></div><div class="pbody" id="insBody"></div></div>
  </div>
  <div id="status">
    <div id="sbMsg"></div>
    <div>X,Y<span class="v" id="sbXY">0, 0</span></div>
    <div>Zoom<span class="v" id="sbZoom">100%</span></div>
    <div>Tick<span class="v" id="sbTick">0</span></div>
    <div>Ticks/s<span class="v" id="sbTps">0</span></div>
    <div>FPS<span class="v" id="sbFps">0</span></div>
    <div id="sbStats"></div>
    <div id="sbSim"></div>
  </div>
</div>
<div class="dd" id="dd"></div>
<div id="dlgWrap"><div class="dlg"><div class="tt" id="dlgT"></div><div class="bd" id="dlgB"></div><div class="ft" id="dlgF"></div></div></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
'use strict';
/* =====================================================================
   ENGINE — primitives, hierarchical compiler, switch-level simulator
   ===================================================================== */
const GRID = 20;
const M = w => (w >= 32 ? -1 : (1 << w) - 1);
let _u = 0;
const uid = p => (p || 'c') + (++_u).toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const clampW = w => Math.max(1, Math.min(32, (w | 0) || 1));
const LIB = { chips: {} };
const SEG_HEX = [0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x6F, 0x77, 0x7C, 0x39, 0x5E, 0x79, 0x71];
const OLED_DW = { mono: 1, gray: 4, rgb: 8 };
const P = (n, dir, w, x, y, side, label) => ({ n, dir, w: w || 1, x, y, side, label: label == null ? n : label });
const portW = w => (w <= 1 ? 3 : Math.max(3, Math.ceil(w * 0.6) + 2));
const log2 = n => Math.round(Math.log2(n));

/* ---------- primitive & peripheral types ---------- */
const T = {
  power: { name: 'Power', cat: 'Sources', glyph: '1', hint: 'Constant 1 (HIGH / VCC)',
    size: () => ({ w: 2, h: 2 }), pins: () => [P('out', 'out', 1, 2, 1, 'R', '')],
    build(b, c, net) { b.el('CONST', [], [net('out')], { v: 1 }); } },
  ground: { name: 'Ground', cat: 'Sources', glyph: '0', hint: 'Constant 0 (LOW / GND)',
    size: () => ({ w: 2, h: 2 }), pins: () => [P('out', 'out', 1, 2, 1, 'R', '')],
    build(b, c, net) { b.el('CONST', [], [net('out')], { v: 0 }); } },
  toggle: { name: 'Toggle Switch', cat: 'Sources', glyph: '⏻', hint: 'Click to flip between 0 and 1', def: { value: 0, label: '' },
    size: () => ({ w: 2, h: 2 }), pins: () => [P('out', 'out', 1, 2, 1, 'R', '')],
    build(b, c, net) { b.el('SRC', [], [net('out')], { kind: 'toggle', v: c.props.value & 1 }, c.id); } },
  button: { name: 'Push Button', cat: 'Sources', glyph: '◉', hint: 'Momentary: 1 only while held', def: { label: '' },
    size: () => ({ w: 2, h: 2 }), pins: () => [P('out', 'out', 1, 2, 1, 'R', '')],
    build(b, c, net) { b.el('SRC', [], [net('out')], { kind: 'button', v: 0 }, c.id); } },
  clock: { name: 'Clock', cat: 'Sources', glyph: '⎍', hint: 'Toggles every tick (rate set in toolbar)', def: { label: '' },
    size: () => ({ w: 3, h: 2 }), pins: () => [P('out', 'out', 1, 3, 1, 'R', '')],
    build(b, c, net) { b.el('SRC', [], [net('out')], { kind: 'clock', v: 0 }, c.id); } },
  input: { name: 'Input Port', cat: 'Ports', glyph: '⇥', hint: 'Named chip input. Clickable bits when testing.', def: { name: 'A', width: 1, value: 0 },
    size: c => ({ w: portW(clampW(c.props.width)), h: 2 }),
    pins: c => [P('out', 'out', clampW(c.props.width), portW(clampW(c.props.width)), 1, 'R', '')],
    build(b, c, net, cx) {
      const w = clampW(c.props.width);
      if (cx.top) b.el('SRC', [], [net('out')], { kind: 'input', v: (c.props.value | 0) & M(w) }, c.id);
      else b.port('in', String(c.props.name), w, net('out'), c);
    } },
  output: { name: 'Output Port', cat: 'Ports', glyph: '⇤', hint: 'Named chip output', def: { name: 'Y', width: 1 },
    size: c => ({ w: portW(clampW(c.props.width)), h: 2 }),
    pins: c => [P('in', 'in', clampW(c.props.width), 0, 1, 'L', '')],
    build(b, c, net, cx) { if (!cx.top) b.port('out', String(c.props.name), clampW(c.props.width), net('in'), c); } },
  sw_no: { name: 'NO Switch', cat: 'Switches', glyph: '⊸', hint: 'Normally-open: conducts in→out when ctrl = 1', def: { width: 1 },
    size: () => ({ w: 2, h: 2 }),
    pins: c => { const w = clampW(c.props.width); return [P('in', 'in', w, 0, 1, 'L', ''), P('ctrl', 'in', 1, 1, 2, 'B', ''), P('out', 'out', w, 2, 1, 'R', '')]; },
    build(b, c, net) { b.el('SW', [net('in'), net('ctrl')], [net('out')], { nc: 0 }); } },
  sw_nc: { name: 'NC Switch', cat: 'Switches', glyph: '⊷', hint: 'Normally-closed: conducts in→out when ctrl = 0', def: { width: 1 },
    size: () => ({ w: 2, h: 2 }),
    pins: c => { const w = clampW(c.props.width); return [P('in', 'in', w, 0, 1, 'L', ''), P('ctrl', 'in', 1, 1, 2, 'B', ''), P('out', 'out', w, 2, 1, 'R', '')]; },
    build(b, c, net) { b.el('SW', [net('in'), net('ctrl')], [net('out')], { nc: 1 }); } },
  split: { name: 'Bus Splitter', cat: 'Wiring', glyph: '⋔', hint: 'Bus → individual bits (b0 = LSB)', def: { width: 4 },
    size: c => ({ w: 2, h: clampW(c.props.width) + 1 }),
    pins: c => { const n = clampW(c.props.width); const r = [P('in', 'in', n, 0, 1, 'L', '')]; for (let i = 0; i < n; i++) r.push(P('b' + i, 'out', 1, 2, i + 1, 'R', '' + i)); return r; },
    build(b, c, net) { const n = clampW(c.props.width), o = []; for (let i = 0; i < n; i++) o.push(net('b' + i)); b.el('SPLIT', [net('in')], o, {}); } },
  merge: { name: 'Bus Merger', cat: 'Wiring', glyph: '⋲', hint: 'Individual bits → bus (b0 = LSB)', def: { width: 4 },
    size: c => ({ w: 2, h: clampW(c.props.width) + 1 }),
    pins: c => { const n = clampW(c.props.width); const r = []; for (let i = 0; i < n; i++) r.push(P('b' + i, 'in', 1, 0, i + 1, 'L', '' + i)); r.push(P('out', 'out', n, 2, 1, 'R', '')); return r; },
    build(b, c, net) { const n = clampW(c.props.width), ii = []; for (let i = 0; i < n; i++) ii.push(net('b' + i)); b.el('MERGE', ii, [net('out')], {}); } },
  led: { name: 'LED', cat: 'Displays', glyph: '●', hint: 'Single-bit light', def: { color: '#ff4d4d', label: '' },
    size: () => ({ w: 2, h: 2 }), pins: () => [P('in', 'in', 1, 0, 1, 'L', '')] },
  busread: { name: 'Bus Readout', cat: 'Displays', glyph: '▦', hint: 'LED bar + binary / decimal / hex', def: { width: 8, label: '' },
    size: c => ({ w: Math.max(5, Math.ceil(clampW(c.props.width) * 0.55) + 2), h: 3 }),
    pins: c => [P('in', 'in', clampW(c.props.width), 0, 1, 'L', '')] },
  seg7: { name: '7-Segment', cat: 'Displays', glyph: '8', hint: 'Hex digit (4-bit) or raw a–g segments', def: { mode: 'hex', color: '#ff3b3b' },
    size: c => (c.props.mode === 'seg' ? { w: 5, h: 9 } : { w: 4, h: 6 }),
    pins: c => (c.props.mode === 'seg'
      ? ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'dp'].map((n, i) => P(n, 'in', 1, 0, i + 1, 'L'))
      : [P('v', 'in', 4, 0, 1, 'L', 'V'), P('dp', 'in', 1, 0, 2, 'L', 'dp')]),
    build(b, c, net) { /* sink: read at draw time */ } },
  oled: { name: 'OLED Display', cat: 'Displays', glyph: '▣', hint: 'Pixel screen: X, Y, D, WE, CLK, CLR', def: { res: 32, color: 'mono' },
    size: () => ({ w: 9, h: 8 }),
    pins: c => { const ab = log2(c.props.res | 0 || 32), dw = OLED_DW[c.props.color] || 1;
      return [P('x', 'in', ab, 0, 1, 'L', 'X'), P('y', 'in', ab, 0, 2, 'L', 'Y'), P('d', 'in', dw, 0, 3, 'L', 'D'), P('we', 'in', 1, 0, 4, 'L', 'WE'), P('clk', 'in', 1, 0, 5, 'L', 'CLK'), P('clr', 'in', 1, 0, 6, 'L', 'CLR')]; },
    build(b, c, net) { b.el('OLED', ['x', 'y', 'd', 'we', 'clk', 'clr'].map(n => net(n)), [], { res: c.props.res | 0 || 32, color: c.props.color }, c.id); } },

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ($('#dd').classList.contains('show') || $('#dlgWrap').classList.contains('show'))) { closeMenus(); closeDlg(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'o')) { e.preventDefault(); if (e.target.blur) e.target.blur(); if (e.key === 's') saveToLibrary(); else $('#file').click(); return; }
  if (e.target.matches && e.target.matches('input,textarea,select')) return;
  if ($('#dlgWrap').classList.contains('show')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (mod && k === 'c') { if (copySel()) e.preventDefault(); }
  else if (mod && k === 'x') { if (copySel()) { e.preventDefault(); delSel(); } }
  else if (mod && k === 'v') { e.preventDefault(); paste(); }
  else if (mod && k === 'd') { e.preventDefault(); if (copySel()) paste(); }
  else if (mod && k === 'a') { e.preventDefault(); selectAll(); }
  else if (mod && k === 's') { e.preventDefault(); saveToLibrary(); }
  else if (mod && k === 'o') { e.preventDefault(); $('#file').click(); }
  else if (mod) return;
  else if (k === 'delete' || k === 'backspace') { e.preventDefault(); delSel(); }
  else if (k === 'escape') { S.wiring = null; S.place = null; S.box = null; M0 = null; renderPalette(); hint(); S.dirty = true; }

  else if (k === 'f') transformSel(c => { c.flip = !c.flip; });
  else if (k === 't') traceSel();
  else if (k === 'p') toggleRun();
  else if (k === '.') step();

let liveT = 0;
function renderInspectorLive(force) {

}

/* ---------------- logic analyzer ---------------- */
const HMAX = 1200;
function addTrace(c, p) {
  if (S.traces.some(t => t.c === c.id && t.p === p)) return;
  const pin = G(c).pm.get(p); if (!pin) return;
  const base = c.type === 'chip' ? (LIB.chips[c.props.chipId] ? LIB.chips[c.props.chipId].circuit.meta.name : 'chip') : (c.props.name || c.props.label || SHORT[c.type] || T[c.type].name);
  S.traces.push({ c: c.id, p, label: `${base}.${pin.label || p}`.replace(/\.$/, ''), w: pin.w, net: netOf(c.id, p), hist: [] });
  if (!S.ui.an) togglePanel('an'); S.anDirty = true; sizeCanvases(); sample();
}
function traceSel() {
  const m = cmap(); let n = 0;
  for (const w of C().wires) if (S.selW.has(w.id)) { const c = m.get(w.a.c); if (c) { addTrace(c, w.a.p); n++; } }
  for (const id of S.sel) { const c = m.get(id); if (!c) continue; const pins = G(c).pins; const outs = pins.filter(p => p.dir === 'out'); for (const p of (outs.length ? outs : pins).slice(0, 8)) { addTrace(c, p.n); n++; } }
  if (!n) toast('Select a wire or a part first, then trace it (T).');
}
function sample() {
  const s = S.sim; if (!s || !S.traces.length) return;
  for (const t of S.traces) {
    const n = t.net; t.hist.push(n === undefined ? null : { v: s.val[n] >>> 0, z: s.zm[n] === s.nm[n], x: s.xm[n] !== 0 });
    if (t.hist.length > HMAX * 1.5) t.hist.splice(0, t.hist.length - HMAX);

}
const ROWH = 20, LBLW = 150;
function drawAn() {
  const W = an.width / DPR, H = an.height / DPR; ag.setTransform(DPR, 0, 0, DPR, 0, 0); ag.fillStyle = '#1e1e1e'; ag.fillRect(0, 0, W, H);
  $('#anEmpty').style.display = S.traces.length ? 'none' : 'flex';
  $('#anInfo').textContent = S.traces.length ? `  ${S.traces.length} signal(s)` : '';
  if (!S.traces.length) return;
  const px = 12, cols = Math.max(1, Math.floor((W - LBLW - 4) / px));
  ag.fillStyle = '#2b2b2b'; ag.fillRect(0, 0, LBLW, H);
  ag.strokeStyle = '#2a2a2a'; ag.lineWidth = 1;
  for (let k = 0; k <= cols; k += 4) { const x = LBLW + k * px + .5; ag.beginPath(); ag.moveTo(x, 0); ag.lineTo(x, H); ag.stroke(); }
  S.traces.forEach((t, r) => {
    const y = r * ROWH, top = y + 4, bot = y + ROWH - 4, mid = y + ROWH / 2;
    ag.font = `11px ${MONO}`; ag.fillStyle = '#d0d0d0'; ag.textAlign = 'left'; ag.textBaseline = 'middle';
    let lab = t.label; while (ag.measureText(lab).width > LBLW - 24 && lab.length > 3) lab = lab.slice(0, -2) + '~';
    ag.fillText(lab, 6, mid); ag.fillStyle = '#7a7a7a'; ag.fillText('x', LBLW - 13, mid);
    ag.strokeStyle = '#333'; ag.beginPath(); ag.moveTo(0, y + ROWH - .5); ag.lineTo(W, y + ROWH - .5); ag.stroke();
    ag.strokeStyle = '#3c3f41'; ag.beginPath(); ag.moveTo(LBLW - .5, y); ag.lineTo(LBLW - .5, y + ROWH); ag.stroke();
    const h = t.hist, start = Math.max(0, h.length - cols);
    if (t.w === 1) {
      ag.lineWidth = 1.4; let prev = null;
      for (let i = start; i < h.length; i++) {
        const s = h[i], x = LBLW + (i - start) * px; if (!s) { prev = null; continue; }
        const yy = s.x || s.z ? mid : (s.v & 1 ? top : bot);
        ag.strokeStyle = s.x ? CL.x : s.z ? CL.z : CL.on;
        ag.beginPath(); if (prev != null && prev !== yy) { ag.moveTo(x + .5, prev); ag.lineTo(x + .5, yy); } else ag.moveTo(x, yy); ag.lineTo(x + px, yy); ag.stroke();
        prev = yy;
      }
    } else {
      let i = start;
      while (i < h.length) {
        let j = i + 1; const s = h[i]; while (j < h.length && h[j] && s && h[j].v === s.v && h[j].z === s.z && h[j].x === s.x) j++;

        if (s) { ag.strokeStyle = s.x ? CL.x : s.z ? CL.z : CL.bus; ag.lineWidth = 1.2;
          ag.beginPath(); ag.moveTo(x0, mid); ag.lineTo(x0 + 2.5, top); ag.lineTo(x1 - 2.5, top); ag.lineTo(x1, mid); ag.lineTo(x1 - 2.5, bot); ag.lineTo(x0 + 2.5, bot); ag.closePath(); ag.stroke();
          const lab2 = s.z ? 'Z' : s.x ? 'X' : hex(s.v, t.w); ag.font = `10px ${MONO}`; if (x1 - x0 > ag.measureText(lab2).width + 6) { ag.fillStyle = '#cfe6ff'; ag.textAlign = 'center'; ag.fillText(lab2, (x0 + x1) / 2, mid + .5); } }
        i = j;
      }
    }
  });
}
an.addEventListener('click', e => { const r = an.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, row = Math.floor(y / ROWH); if (x > LBLW - 20 && x < LBLW && S.traces[row]) { S.traces.splice(row, 1); sizeCanvases(); S.anDirty = true; } });

/* ---------------- sim controls ---------------- */
function setHz(h) { S.hz = h; }
function toggleRun() { S.running = !S.running; renderToolbar(); }
function step() { if (!S.sim) return; S.sim.edge(); S.sim.settle(); sample(); S.dirty = true; renderInspectorLive(true); }
function resetSim() { RT.clear(); OC.clear(); for (const t of S.traces) t.hist = []; S.need = true; toast('Simulation reset.'); }

/* ---------------- import / export ---------------- */
const slug = s => String(s || 'circuit').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'circuit';
function download(name, obj) { const b = new Blob([JSON.stringify(obj)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function exportChip(id) { const d = LIB.chips[id]; if (!d) return; const chips = {}; for (const x of [id, ...chipDeps(id)]) if (LIB.chips[x]) chips[x] = LIB.chips[x]; download(slug(d.circuit.meta.name) + '.chip.json', { format: 'switchboard-chip', version: 1, root: id, chips }); toast(`Exported "${d.circuit.meta.name}" with ${Object.keys(chips).length - 1} dependencies.`); }
function exportCurrent() { const c = C(), id = L().chipId || uid('chip'), chips = {}; for (const x of circDeps(c)) if (LIB.chips[x]) chips[x] = LIB.chips[x]; chips[id] = { id, version: 1, circuit: c }; download(slug(c.meta.name) + '.chip.json', { format: 'switchboard-chip', version: 1, root: id, chips }); }
function importObj(o, quiet) {
  if (!o || typeof o !== 'object') throw new Error('Not a JSON object');
  let n = 0;
  const chips = o.chips || (o.library && o.library.chips) || null;
  if (chips) for (const [id, d] of Object.entries(chips)) { if (!d || !d.circuit || !Array.isArray(d.circuit.components)) continue; const old = LIB.chips[id]; LIB.chips[id] = { id, version: (old ? old.version : 0) + (d.version || 1), circuit: d.circuit }; n++; }
  invalidate();
  const proj = o.project || o.main || (Array.isArray(o.components) ? o : null);
  if (proj) { closeTo(0, true); commit(); S.main.meta = proj.meta || newCirc().meta; S.main.components = proj.components || []; S.main.wires = proj.wires || []; RT.clear(); OC.clear(); changed(); fit(); }
  persist(); renderAll();
  if (!quiet) toast(`Imported ${n} chip(s)${proj ? ' and the project circuit' : ''}.`);
}
function importOld() { try { importObj(JSON.parse(localStorage.getItem(OLDKEY)), true); toast('Imported previous session (circuit and library).'); } catch (e) { toast('Import failed: ' + e.message, true); } }
$('#file').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { importObj(JSON.parse(r.result)); } catch (err) { toast('Import failed: ' + err.message, true); } }; r.readAsText(f); e.target.value = ''; });
function loadExample(ex) {
  const go = () => {
    closeTo(0, true); commit();
    const circ = ex.build(); S.main.meta = circ.meta; S.main.components = circ.components; S.main.wires = circ.wires;
    RT.clear(); OC.clear(); S.traces = []; S.sel.clear(); S.selW.clear(); invalidate(); changed(); renderAll(); fit(); sizeCanvases();
    if (ex.id === 3) { setHz(30); if (!S.running) S.running = true; renderToolbar(); }
    toast(`Loaded example "${ex.name}". Its pre-built chips were added to the library.`);
  };
  dialog('Load Example', `Load <b>${esc(ex.name)}</b>?<br><br>This replaces the main circuit (undo restores it) and adds the example's pre-built chips (gates, adders, etc.) to your library, overwriting earlier copies of those example chips.`, [{ l: 'Load', pri: true, f: go }, { l: 'Cancel' }]);
}
const FILE = {
  new: () => { closeTo(0, true); commit(); S.main.meta = newCirc().meta; S.main.components = []; S.main.wires = []; S.traces = []; changed(); fit(); renderAll(); sizeCanvases(); },
  exportProject: () => download(slug(S.main.meta.name) + '.project.json', { format: 'switchboard-project', version: 1, chips: LIB.chips, project: S.main }),
  exportLib: () => download('switchboard-library.json', { format: 'switchboard-library', version: 1, chips: LIB.chips }),
  wipe: () => dialog('Clear Everything', 'Delete the main circuit and <b>every chip in the library</b> from this browser?<br><br>Export a project bundle first if you want a backup. This cannot be undone.',
    [{ l: 'Clear everything', pri: true, f: () => { try { localStorage.removeItem(KEY); } catch (e) {} LIB.chips = {}; invalidate(); S.levels = [S.levels[0]]; S.main.meta = newCirc().meta; S.main.components = []; S.main.wires = []; L().undo = []; L().redo = []; S.traces = []; RT.clear(); changed(); renderAll(); fit(); } }, { l: 'Cancel' }]),
};

/* ---------------- chrome: crumbs, panels, splitters ---------------- */
function renderCrumbs() {
  const el = $('#crumbs'); if (!el) return;
  el.innerHTML = S.levels.map((l, i) => { const nm = esc(l.circ.meta.name || (i ? 'Chip' : 'Untitled')) + (l.edited ? '*' : ''); return i === S.levels.length - 1 ? `<b>${nm}</b>` : `<a data-l="${i}" style="color:#9cc4ff;cursor:default">${nm}</a> &gt;`; }).join(' ');
  el.querySelectorAll('a').forEach(a => a.onclick = () => closeTo(+a.dataset.l, true));
  const lv = L(); $('#editbar').classList.toggle('show', !!lv.chipId); $('#ebName').textContent = lv.chipId ? (C().meta.name || 'Chip') + (lv.edited ? ' (modified)' : '') : '';
}
function renderAll() { renderCrumbs(); renderToolbar(); renderPalette(); renderInspector(); updUndo(); hint(); }
function applyLayout() {
  const u = S.ui, root = document.documentElement.style;
  root.setProperty('--palW', u.palW + 'px'); root.setProperty('--insW', u.insW + 'px'); root.setProperty('--anH', u.anH + 'px');
  $('#palette').classList.toggle('hidden', !u.pal); $('#spPal').classList.toggle('hidden', !u.pal);
  $('#inspector').classList.toggle('hidden', !u.ins); $('#spIns').classList.toggle('hidden', !u.ins);
  $('#analyzer').classList.toggle('hidden', !u.an); $('#spAn').classList.toggle('hidden', !u.an);
}
function togglePanel(k) { S.ui[k] = !S.ui[k]; applyLayout(); persist(); setTimeout(sizeCanvases, 0); }
function splitter(el, axis, get, set) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag'); const s0 = axis === 'x' ? e.clientX : e.clientY, v0 = get();
    const mv = ev => { set(v0, (axis === 'x' ? ev.clientX : ev.clientY) - s0); applyLayout(); sizeCanvases(); };
    const up = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); persist(); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
}
splitter($('#spPal'), 'x', () => S.ui.palW, (v, d) => { S.ui.palW = Math.max(140, Math.min(480, v + d)); });
splitter($('#spIns'), 'x', () => S.ui.insW, (v, d) => { S.ui.insW = Math.max(200, Math.min(560, v - d)); });
splitter($('#spAn'), 'y', () => S.ui.anH, (v, d) => { S.ui.anH = Math.max(60, Math.min(innerHeight * .6, v - d)); });
document.querySelectorAll('[data-hide]').forEach(x => x.onclick = () => togglePanel(x.dataset.hide));
$('#anAdd').onclick = traceSel; $('#anClear').onclick = () => { for (const t of S.traces) t.hist = []; S.anDirty = true; }; $('#anRm').onclick = () => { S.traces = []; sizeCanvases(); S.anDirty = true; };
$('#ebSave').onclick = () => saveChip(); $('#ebDone').onclick = () => closeTo(S.levels.length - 2, true); $('#ebDiscard').onclick = () => closeTo(S.levels.length - 2, false);

function sizeCanvases() {
  DPR = Math.max(1, window.devicePixelRatio || 1);
  const w = $('#wrap'); cv.width = Math.max(1, w.clientWidth * DPR); cv.height = Math.max(1, w.clientHeight * DPR);
  const ab = $('#anBody'); const aw = ab.clientWidth, ah = Math.max(ab.clientHeight, S.traces.length * ROWH);
  an.style.height = ah + 'px'; an.width = Math.max(1, aw * DPR); an.height = Math.max(1, ah * DPR);
  S.dirty = true; S.anDirty = true;
}
new ResizeObserver(sizeCanvases).observe($('#wrap'));
new ResizeObserver(sizeCanvases).observe($('#anBody'));

/* ---------------- main loop + status bar ---------------- */
let lastT = performance.now(), fN = 0, fT = lastT, fps = 0, tickN = 0, tps = 0;
function frame(t) {
  const dt = Math.min(250, t - lastT); lastT = t;
  if (S.need) { recompile(); renderInspectorLive(true); if (!S.sel.size && !S.selW.size && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#insBody'))) renderInspector(); }
  const sim = S.sim;
  if (sim) {
    if (sim.qn > 0) sim.settle(Math.min(sim.budget, 60000));
    if (S.running && sim.clocks.length) {
      const t0 = performance.now();
      if (S.turbo) { do { for (let k = 0; k < 8; k++) { sim.edge(); sim.settle(); sample(); tickN++; } } while (performance.now() - t0 < 12); }
      else { S.acc += dt / 1000 * S.hz * 2; let n = Math.floor(S.acc); S.acc -= n; while (n-- > 0) { sim.edge(); sim.settle(); sample(); tickN++; if (performance.now() - t0 > 12) { S.acc = 0; break; } } }
    }
    if (sim.changed) { sim.changed = false; S.dirty = true; renderInspectorLive(); }
  }
  if (S.dirty) { S.dirty = false; draw(); }
  if (S.anDirty) { S.anDirty = false; drawAn(); }
  fN++;
  if (t - fT >= 500) { const s = (t - fT) / 1000; fps = fN / s; tps = tickN / s; fN = 0; tickN = 0; fT = t; statusBar(); }
  requestAnimationFrame(frame);
}
function statusBar() {
  const s = S.sim, c = C(), sh = s ? s.shorts() : 0, fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n));
  $('#sbTick').textContent = s ? s.ticks : 0; $('#sbTps').textContent = fmt(tps); $('#sbFps').textContent = Math.round(fps);
  $('#sbStats').innerHTML = `Parts<span class="v">${c.components.length}</span>&nbsp; Switches<span class="v">${s ? fmt(s.counts.SW || 0) : 0}</span>&nbsp; Nets<span class="v">${s ? fmt(s.N) : 0}</span>`;
  $('#sbSim').innerHTML = 'Simulation: ' + (s ? (s.unstable ? '<span class="warn">&nbsp;Oscillating</span>' : '<span class="good">&nbsp;Stable</span>') : '<span class="bad">&nbsp;Error</span>') + (sh ? `<span class="bad">&nbsp;| ${sh} short(s)</span>` : '') + (S.running && s && s.clocks.length ? '' : (s && s.clocks.length ? '&nbsp;| Paused' : ''));
}

/* ---------------- boot ---------------- */
(function boot() {
  const had = loadSaved();
  if (!had) S.main = newCirc({ name: 'Untitled' });
  S.levels = [{ circ: S.main, undo: [], redo: [], view: null }];
  renderMenubar(); applyLayout(); sizeCanvases(); renderAll();
  fit(); if (!had) S.view.z = 1, fit();
  if (!had && hasOld()) toast('A session from the previous version exists. File > Import session from previous version restores it.');
  requestAnimationFrame(frame);
})();
